[project]
name = "maef-control-plane"
version = "0.1.0"
description = "Modular Agent Execution Framework — local-first control plane"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pyyaml>=6,<7"]

[project.optional-dependencies]
bedrock = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
markers = ["oci: needs a real podman or docker runtime (make test-oci); skipped when none is installed"]
