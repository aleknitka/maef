# Checks for every pull request and every push to main. Free on a public repository; kept small anyway:
# superseded runs are cancelled, every job has a timeout, and no job calls a paid model or needs a secret.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {enable-cache: true}
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true # advisory until the ty findings are fixed (M1 step 6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {enable-cache: true}
      - run: uv sync --all-extras
      - run: uv run ty check apps/api

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {enable-cache: true}
      - run: uv sync --all-extras
      - run: uv run pytest -q

  tui:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run: {working-directory: apps/tui}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test

  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run: {working-directory: apps/studio}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/studio/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build # type-checks (tsc -b) and builds; there are no Studio tests yet

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {enable-cache: true}
      - run: uv sync --all-extras
      - run: uv run pip-audit --skip-editable --progress-spinner off
