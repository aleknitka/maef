# Unit tests on macOS, weekly and by hand. GitHub's macOS runners can't run podman machine (no nested
# virtualisation), so the container suites run on Linux only.
name: macos
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: "1"

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {enable-cache: true}
      - run: uv sync --all-extras
      - run: uv run pytest -q
