schema_version: maef.dev/v1alpha1
id: openrouter-nemotron-lightning-free
version: 0.1.0
display_name: OpenRouter nvidia/nemotron-3.5-lightning:free
vendor: OpenRouter
api_dialect: openai-compatible
endpoint:
  kind: openai-compatible
  base_url: https://openrouter.ai/api/v1
  # Free models end in ":free" (rate-limited; providers may log prompts). Cheap paid alternative: qwen/qwen3.7-flash.
  # The agent's tools need a model whose OpenRouter page lists "tools" support.
  model_id: nvidia/nemotron-3.5-lightning:free
  # reasoning_effort: low   # minimal | low | medium | high; sent as top-level reasoning_effort
credential_ref: env:OPENROUTER_API_KEY
capabilities:
  input_modalities: [text]
  streaming: false
timeout_seconds: 300
max_retries: 2
