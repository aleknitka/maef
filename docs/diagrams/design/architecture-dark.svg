<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" id="architecture-dark-root">
        <title id="architecture-dark-title">How MAEF fits together</title>
        <desc id="architecture-dark-desc">Clients call the MAEF API, which keeps the ledger, artifacts and agent definitions, while a separate worker talks only to the API and runs models, a sandbox and tool containers.</desc>
        <defs>
      <style>#architecture-dark-root { --color-paper:   #14171c;
      --color-paper-2: #1c2027;
      --color-ink:     #e4e7ec;
      --color-muted:   #a3acba;
      --color-accent:  #5b9bff;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-dark-root .diagram-container { overflow-x: visible; }
}</style>
