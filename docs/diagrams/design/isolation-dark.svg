<rect x="376" y="120" width="48" height="12" rx="2" fill="#14171c"/>
<text x="400" y="129" fill="#8db3e2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

<text x="640" y="164" fill="#8e98a8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">http only to localhost · no redirects · no metadata addresses</text>
