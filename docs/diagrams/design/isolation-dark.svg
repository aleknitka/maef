<line x1="912" y1="280" x2="1096" y2="280" stroke="#8db3e2" stroke-width="1.4" marker-end="url(#isolation-dark-arrow-link)"/>
<path d="M 824,360 V 440 Q 824,448 832,448 H 1044" fill="none" stroke="#a3acba" stroke-width="1" stroke-dasharray="4,3"/>
