<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="isolation-dark-title isolation-dark-desc" id="isolation-dark-root">
<title id="isolation-dark-title">Isolation and the network</title>
<desc id="isolation-dark-desc">Architecture diagram of one run on the worker machine: the worker reaches the model over HTTPS, runs commands in a networkless sandbox, and sends tool traffic through a private per-run network whose only exit, the egress proxy, allows public sites and blocks private addresses and cloud metadata.</desc>
<defs>
      <style>#isolation-dark-root { --color-paper:   #14171c;
      --color-ink:     #e4e7ec;
      --color-muted:   #a3acba;
      --color-accent:  #5b9bff;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #isolation-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #isolation-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#isolation-dark-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="isolation-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3acba"/></marker>
<marker id="isolation-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b9bff"/></marker>
<marker id="isolation-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8db3e2"/></marker>
<pattern id="isolation-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#e4e7ec" fill-opacity="0.06"/></pattern>
</defs>
<rect width="100%" height="100%" fill="#14171c"/>
<rect width="100%" height="100%" fill="url(#isolation-dark-dots)"/>

<!-- Zones -->
<rect x="32" y="56" width="1032" height="520" rx="8" fill="#e4e7ec" stroke="rgba(228,231,236,0.18)" stroke-width="1" fill-opacity="0.02"/>
<rect x="496" y="50" width="104" height="12" rx="2" fill="#14171c"/>
<text x="548" y="59" fill="#8e98a8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WORKER MACHINE</text>

<rect x="336" y="224" width="648" height="184" rx="8" fill="#5b9bff" stroke="rgba(91,155,255,0.5)" stroke-width="1" stroke-dasharray="6,4" fill-opacity="0.04"/>
<rect x="572" y="218" width="176" height="12" rx="2" fill="#14171c"/>
<text x="660" y="227" fill="#8e98a8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PRIVATE PER-RUN NETWORK</text>


<!-- Arrows first -->
<path d="M 144,256 V 148 Q 144,140 152,140 H 1096" fill="none" stroke="#8db3e2" stroke-width="1.2" marker-end="url(#isolation-dark-arrow-link)"/>
