<text x="196" y="373" fill="#8e98a8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RUN_COMMAND</text>


<!-- Nodes -->
<rect x="56" y="256" width="176" height="72" rx="6" fill="#14171c"/>
<rect x="56" y="256" width="176" height="72" rx="6" fill="#1c2027" stroke="#e4e7ec" stroke-width="1"/>
<rect x="64" y="264" width="44" height="12" rx="2" fill="none" stroke="#e4e7ec" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="86" y="273" fill="#e4e7ec" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
<text x="144" y="296" fill="#e4e7ec" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Worker process</text>
<text x="144" y="312" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runs the agent loop</text>

<rect x="56" y="416" width="176" height="128" rx="6" fill="#14171c"/>
<rect x="56" y="416" width="176" height="128" rx="6" fill="#e4e7ec" stroke="rgba(228,231,236,0.5)" stroke-width="1" stroke-dasharray="4,4" fill-opacity="0.05"/>
<rect x="64" y="424" width="44" height="12" rx="2" fill="none" stroke="#a3acba" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="86" y="433" fill="#a3acba" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SANDBOX</text>
<text x="144" y="456" fill="#e4e7ec" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sandbox container</text>
<text x="144" y="472" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read-only root</text>
<text x="144" y="486" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no capabilities · no network</text>
<text x="144" y="500" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">unprivileged user</text>
<text x="144" y="514" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">temp /workspace</text>

<rect x="384" y="256" width="160" height="72" rx="6" fill="#14171c"/>
<rect x="384" y="256" width="160" height="72" rx="6" fill="#1c2027" stroke="#e4e7ec" stroke-width="1"/>
<rect x="392" y="264" width="28" height="12" rx="2" fill="none" stroke="#e4e7ec" stroke-opacity="0.5" stroke-width="0.8"/>
<text x="406" y="273" fill="#e4e7ec" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
<text x="464" y="296" fill="#e4e7ec" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MCP server</text>
<text x="464" y="312" fill="#a3acba" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own container</text>

<rect x="736" y="256" width="176" height="104" rx="6" fill="#14171c"/>
<rect x="736" y="256" width="176" height="104" rx="6" fill="#5b9bff" stroke="#5b9bff" stroke-width="1" fill-opacity="0.12"/>
