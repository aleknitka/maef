schema_version: maef.dev/v1alpha1
id: restricted-local
# busybox 1.37, pinned to the multi-arch manifest-list digest (amd64 + arm64), so it works on
# Linux/WSL2 and Apple Silicon. To re-pin: `podman image inspect --format '{{json .RepoDigests}}' <image>`
# and use the digest that `podman image ls --digests` shows for the tag (the list, not one platform).
image: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
cpus: 1.0
memory_mb: 256
pids_limit: 128
workspace_mb: 64
network: none
require_rootless: true
user: "65534:65534"
