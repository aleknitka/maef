schema_version: maef.dev/v1alpha1
id: restricted-local
# Dev default. Tag-only: the worker refuses it unless MAEF_ALLOW_UNPINNED_IMAGES=1.
# For production pin by digest, e.g. docker.io/library/busybox@sha256:<64 hex>
# (look it up with `podman image inspect --format '{{.Digest}}' <image>`).
image: docker.io/library/busybox:1.37
cpus: 1.0
memory_mb: 256
pids_limit: 128
workspace_mb: 64
network: none
require_rootless: true
user: "65534:65534"
