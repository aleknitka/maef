schema_version: maef.dev/v1alpha1
id: fetch
version: 0.3.0
transport: stdio
# Reference MCP fetch server, pinned by digest (verified with rootless Podman on 2026-11-22).
image: docker.io/mcp/fetch@sha256:1a7a0996a565a0b8ca5c41b42830d4e5f334d33f851596bbd9debb2beedb22d3
# The image's default entrypoint (`mcp-server-fetch`); MAEF execs the command in a sandboxed container.
command: ["mcp-server-fetch"]
env: {}
secrets: {}
# Fetching web pages needs the network. `allowlist` runs the server on an internal-only network whose
# single way out is the enforced egress proxy: only the hosts below, on 443/80, and only public addresses
# (private, loopback and metadata addresses are always refused). The agent must set permissions.network_open.
#
# This is a short EXAMPLE list for documentation research, not a list for every task. Anything the model can
# fetch is also somewhere it can send data (a URL can carry text from the conversation), so keep the list as
# small as the job allows. To widen it, add exact hosts ("docs.example.com") or a subdomain pattern
# ("*.example.com", which does not match example.com itself). Do not use "*": `maef lint` warns about it and it
# lets a prompt-injected run reach any public site. Changing this file changes the manifest digest, so bump
# `version` and the `mcp_servers` reference in each agent that uses it.
network: allowlist
allowed_hosts:
  - docs.python.org
  - developer.mozilla.org
  - en.wikipedia.org
  - arxiv.org
  - github.com
  - raw.githubusercontent.com
  - pypi.org
allowed_ports: [443, 80]
permission: read-only
max_tools: 8
# The image's Python interpreter lives under /root, so it cannot run as nobody. Root here is the
# unprivileged host user under rootless Podman (required), with all capabilities dropped.
user: "0:0"
